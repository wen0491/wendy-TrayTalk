<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饭卡 · 校园食堂点评推荐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;900&family=Long+Cang&display=swap">
<style>
:root{--bg:#e9eeec;--card:#fff;--ink:#14302a;--sub:#5d726c;--line:#d3dcd9;--yel:#f2c230;--yelink:#4a3a00;--red:#d7263d;--redbg:#fde6e9;--grn:#1f7a5c;--grnbg:#dff1ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b18;--card:#172823;--ink:#e6f0ed;--sub:#93aaa3;--line:#27403a;--yel:#f2c230;--yelink:#3a2d00;--red:#ff6b7d;--redbg:#3a1d23;--grn:#5fd0a5;--grnbg:#173a2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b18;--card:#172823;--ink:#e6f0ed;--sub:#93aaa3;--line:#27403a;--yel:#f2c230;--yelink:#3a2d00;--red:#ff6b7d;--redbg:#3a1d23;--grn:#5fd0a5;--grnbg:#173a2f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:28px 0 12px}
h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.02em;line-height:1.15}
header p{margin:4px 0 0;color:var(--sub)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
/* decision tray */
.tray{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;margin:14px 0 8px;display:grid;gap:12px}
.tray h2{margin:0;font-size:20px;font-weight:900}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-size:13px;opacity:.75;min-width:3.2em}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:14px}
.tray .chip{border-color:#ffffff40;color:#e6f0ed}
.chip[aria-pressed=true]{background:var(--yel);border-color:var(--yel);color:var(--yelink);font-weight:500}
.go{background:var(--yel);color:var(--yelink);border:0;border-radius:14px;font-weight:900;font-size:20px;padding:12px;width:100%}
.go:active{transform:scale(.98)}
#pick{background:var(--card);color:var(--ink);border-radius:14px;padding:14px;display:none}
#pick.on{display:block;animation:pop .35s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@media (prefers-reduced-motion:reduce){#pick.on{animation:none}}
/* tabs */
nav{display:flex;gap:4px;margin:18px 0 12px;border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{background:none;border:0;padding:10px 12px;font-weight:500;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--yel);font-weight:900}
.tools{display:grid;gap:8px;margin-bottom:12px}
.tools .chip{color:var(--ink)}
.tools select{font:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:3px 8px}
/* dish list */
.list{display:grid;gap:10px}
.dish{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left}
.rk{font-size:22px;font-weight:900;color:var(--sub);width:1.6em;text-align:center}
.dish h3{margin:0;font-size:17px;font-weight:500}
.meta{color:var(--sub);font-size:13px}
.score{text-align:right;font-weight:900;font-size:24px;line-height:1}
.score small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:4px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 7px;margin-right:4px;background:var(--grnbg);color:var(--grn)}
.tag.lei{background:var(--redbg);color:var(--red);font-weight:500}
.tag.new{background:var(--yel);color:var(--yelink);font-weight:500}
.empty{padding:30px;text-align:center;color:var(--sub)}
.note{font-size:13px;color:var(--sub);margin:0 0 10px}
/* dialog */
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:88vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#000a}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h2{margin:0;font-size:24px;font-weight:900}
.bar{height:8px;border-radius:4px;background:var(--redbg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grn)}
.rev{border-top:1px solid var(--line);padding-top:8px}
.stars button{background:none;border:0;font-size:28px;padding:0 2px;color:var(--line)}
.stars button.on{color:var(--yel)}
textarea{width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px;min-height:64px}
.btn{border:0;border-radius:10px;padding:8px 16px;font-weight:500;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--sub);border:1.5px solid var(--line)}
.th{width:52px;height:52px;border-radius:12px;background:var(--grnbg);display:grid;place-items:center;font-size:28px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.qn{font-size:28px;font-weight:900;white-space:nowrap}
.qs{display:inline-block;border-radius:6px;padding:0 8px;font-size:13px;font-weight:500}
.q1{background:var(--grnbg);color:var(--grn)}.q2{background:var(--yel);color:var(--yelink)}.q3{background:var(--redbg);color:var(--red)}
.spark{display:flex;gap:2px;align-items:flex-end;height:28px}.spark i{flex:1;background:var(--line);border-radius:2px}.spark i.now{background:var(--yel)}
.gal{display:flex;gap:6px;overflow-x:auto}.gal img{height:84px;border-radius:10px}
.act{display:flex;gap:14px;font-size:13px;margin-top:4px}.act button{background:none;border:0;padding:0;color:var(--sub);text-decoration:underline}
.rp{margin:4px 0 0 10px;padding-left:10px;border-left:3px solid var(--line);font-size:14px}
.rv img{max-width:160px;border-radius:10px;display:block;margin-top:4px}
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#f3e9d2;--card:#f9f1df;--ink:#2a1712;--sub:#7b6558;--line:#d8c7a3;--yel:#7a1a14;--yelink:#f6ecd6;--red:#b8470f;--redbg:#f4d8c0;--grn:#4d6b3a;--grnbg:#e2e5c6;color-scheme:light}
h1,h2,h3,nav button,.qn,.go,.lab{font-family:"Long Cang","Kaiti SC",STKaiti,cursive;font-weight:400}
.hero{position:relative;margin:0 -16px 8px;height:360px;overflow:hidden;padding:0}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 30%,#2a1712cc)}
.hero h1{position:absolute;left:22px;top:6px;z-index:1;font-size:120px;line-height:1;color:#f6ecd6;transform:rotate(-7deg);text-shadow:0 2px 12px #0006}
.hero p{position:absolute;left:22px;right:22px;bottom:16px;z-index:1;margin:0;color:#f6ecd6}
.tray,.dlg,dialog,.q,.btn,.go,.chip,.tag,.qs,#pick,textarea,.tools select,.dlg img{border-radius:2px}
.tray h2{font-size:30px}.go{font-size:26px}
.tray .go{background:var(--bg);color:var(--ink)}
.tray .chip[aria-pressed=true]{background:var(--bg);color:var(--ink);border-color:var(--bg)}
nav{border-bottom-width:1px}nav button{font-size:22px}
nav button[aria-selected=true]::before{content:"◆ ";color:var(--yel);font-size:.7em}
.list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 12px}
.q,.empty{grid-column:1/-1}
.dish{position:relative;grid-template-columns:1fr;gap:6px;padding:0;background:none;border:0;border-radius:0;align-items:start}
.dish .th{width:100%;height:auto;aspect-ratio:4/5;font-size:64px;border-radius:2px}
.dish h3{font-size:24px;line-height:1.2}
.dish .score{position:absolute;top:8px;right:8px;background:var(--bg);color:var(--ink);padding:4px 8px;font-size:22px;border-radius:2px;font-family:"Long Cang",cursive;font-weight:400}
.dish .score small{display:none}
.himg{width:100%;max-height:240px;object-fit:cover;display:block}
main{max-width:none;padding:0 0 80px}
.hero{margin:0;height:min(88vh,760px)}
.hero .hg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.hero .hg img{position:static;width:100%;height:100%;object-fit:cover}
.hero h1{left:clamp(16px,4vw,48px);font-size:clamp(110px,20vw,260px)}
.hero p{left:clamp(16px,4vw,48px);right:clamp(16px,4vw,48px);bottom:24px;font-size:clamp(15px,1.6vw,20px)}
.tray,nav,.tools,.note,.list,main>p{padding-left:clamp(16px,4vw,48px);padding-right:clamp(16px,4vw,48px)}
.tray{background:transparent;color:var(--ink);border-radius:0;margin:0;padding-top:32px;padding-bottom:32px;border-bottom:1px solid var(--line)}
.tray .chip{border-color:var(--line);color:var(--ink)}
.tray .chip[aria-pressed=true]{background:var(--yel);color:var(--yelink);border-color:var(--yel)}
.tray .go{background:var(--yel);color:var(--yelink);width:auto;justify-self:start;padding:10px 44px}
#pick{background:transparent;border-top:1px solid var(--line);border-radius:0;padding:16px 0 0}
nav{margin:0 0 16px}
.list{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
@media (max-width:640px){.hero{height:70vh}.hero .hg{grid-template-columns:1fr 1fr}.hero .hg img:nth-child(3){display:none}}
</style>
</head>

<h1>饭卡</h1>

<button class="go" id="go">帮我决定</button>

</main>

const E={1:"🍗",2:"🍅",3:"🍜",4:"🌶️",4.5:"🥬",5:"🍜",6:"🧀",7:"🥗",8:"🐟",9:"🍛",10:"🥞",11:"🥩",12:"🥣"};
const thumb=d=>{const p=d.mine.filter(u=>u.p).pop();return '<span class="th">'+(p?'<img src="'+p.p+'" alt="">':IMG[d.id]?'<img src="'+IMG[d.id]+'" alt="'+d.n+'">':E[d.id]||"🍚")+'</span>'};
// 排队：高峰系数（午、晚高峰=1，前后=.6，早餐=.6，其余=.2）
const fq=t=>(t>=11.5&&t<12.75)||(t>=17.5&&t<18.75)?1:(t>=11&&t<13.5)||(t>=17&&t<19)||(t>=7&&t<8.5)?.6:.2;
const nowT=()=>{const n=new Date();return n.getHours()+n.getMinutes()/60};
const B={};D.forEach(d=>{const k=d.c+"·"+d.w;B[k]=Math.max(B[k]||0,d.q)});
function est(k){const r=R[k];if(r&&Date.now()-r.ts<18e5)return{m:r.m,ago:Math.floor((Date.now()-r.ts)/6e4)};return{m:Math.round(B[k]*fq(nowT())),ago:null}}
const curQ=d=>est(d.c+"·"+d.w).m;
// merge user reviews
function calc(d){const mine=U.filter(u=>u.id==d.id);let k=d.k,sum=d.r*d.k,lei=d.lei;
mine.forEach(u=>{k++;sum+=u.s;if(u.s<=2)lei++});
return {...d,k,r:sum/k,rate:lei/k,mine,q:curQ(d),pk:d.q}}
const all=()=>D.map(calc);
const fmtLei=x=>Math.round(x*100)+"%";
function chips(el,opts,key,fmt){el.innerHTML="";opts.forEach(o=>{const b=document.createElement("button");b.className="chip";b.textContent=fmt?fmt(o):o;
b.setAttribute("aria-pressed",st[key]===o);b.onclick=()=>{st[key]=o;chipAll();render()};el.append(b)})}
function chipAll(){
chips($("#fBudget"),[10,15,20,99],"budget",o=>o==99?"不限":"≤"+o+"元");
chips($("#fTaste"),["不限","辣","清淡","下饭"],"taste");
chips($("#fWait"),[5,10,99],"wait",o=>o==99?"不急":"≤"+o+"分钟");
chips($("#fCan"),["全部","一食堂","二食堂","三食堂","四食堂"],"can")}
function filt(list,useTaste){return list.filter(d=>(st.can=="全部"||d.c==st.can)&&d.p<=st.budget&&d.q<=st.wait&&(!useTaste||st.taste=="不限"||d.tags.includes(st.taste)))}
function badge(d){return (d.rate>=.3?'<span class="tag lei">踩雷率 '+fmtLei(d.rate)+'</span>':'')+(d.nw?'<span class="tag new">新品</span>':'')+d.tags.slice(0,2).map(t=>'<span class="tag">'+t+'</span>').join("")}
function card(d,i,showRk){return '<button class="dish" data-id="'+d.id+'">'+thumb(d)+
'<span><h3>'+(showRk?(i+1)+". ":"")+d.n+'</h3><span class="meta">'+d.c+' · '+d.w+' · ¥'+d.p+' · 约排'+d.q+'分钟</span><br>'+badge(d)+'</span>'+
'<span class="score">'+d.r.toFixed(1)+'<small>'+d.k+'人评</small></span></button>'}
function render(){
if(st.tab=="q"){renderQ();return}
let L=filt(all(),false);const n=$("#note");
if(st.tab=="new"){L=L.filter(d=>d.nw);n.textContent="本学期新上的菜品和窗口，评价人数还少，你的第一条点评很有用。"}
else if(st.tab=="lei"){L=L.filter(d=>d.rate>=.2&&d.k>=30).sort((a,b)=>b.rate-a.rate);n.textContent="踩雷率 = 打 1–2 星的人占比，越高越要谨慎。点进去看大家踩在哪里。"}
else n.textContent="评分来自同学点评，人数越多越可信。";
if(st.tab!="lei"){const s=st.sort;L.sort((a,b)=>s=="price"?a.p-b.p:s=="wait"?a.q-b.q:s=="n"?b.k-a.k:(b.r-a.r)||(b.k-a.k))}
$("#list").innerHTML=L.length?L.map((d,i)=>card(d,i,st.tab!="new")).join(""):'<div class="empty">没有符合条件的菜品。试试把食堂改成“全部”。</div>'}
$("#list").onclick=e=>{const q=e.target.closest("[data-rq]");if(q){R[q.dataset.k]={m:+q.dataset.rq,ts:Date.now()};sv("fk_q",R);render();return}const b=e.target.closest(".dish");if(b)open(+b.dataset.id)};
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.tab=b.dataset.t;
document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));render()};
$("#sort").onchange=e=>{st.sort=e.target.value;render()};
// decide
let last=null;
function decide(){let L=filt(all(),true).filter(d=>d.r>=3.8&&d.rate<.25);
if(!L.length){$("#pick").className="on";$("#pick").innerHTML="没有找到合适的菜。试着放宽预算、口味或时间，或把下面的“食堂”选回“全部”。";return}
if(L.length>1)L=L.filter(d=>d.id!==last);
const d=L[Math.floor(Math.random()*L.length)];last=d.id;
const el=$("#pick");el.className="";void el.offsetWidth;el.className="on";
el.innerHTML=(IMG[d.id]?'<img src="'+IMG[d.id]+'" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:2px;margin-bottom:8px">':'')+'<div class="meta">已避开踩雷率偏高和评分偏低的菜</div><h3 style="margin:2px 0;font-size:22px;font-weight:900">'+d.n+' ¥'+d.p+'</h3><div class="meta">'+d.c+' · '+d.w+' · 评分 '+d.r.toFixed(1)+' · 约排'+d.q+'分钟</div><p style="margin:6px 0">'+d.d+'</p><button class="btn" data-id="'+d.id+'">看点评</button> <button class="btn ghost" id="again">换一个</button>'}
$("#go").onclick=decide;
$("#pick").onclick=e=>{if(e.target.id=="again")decide();else if(e.target.dataset.id)open(+e.target.dataset.id)};
// detail
let cur=null,stars=0;
function open(id){cur=id;stars=0;pend=null;rk=null;paint();$("#dlg").showModal()}
function paint(){const d=all().find(x=>x.id==cur);
const revs=[...d.mine.map((u,i)=>({k:d.id+":u"+i,s:u.s,t:u.t,p:u.p,w:"我"})).reverse(),...d.rv.map((r,i)=>({k:d.id+":s"+i,s:r[0],t:r[1],w:"同学"}))];
const ph=revs.filter(r=>r.p),gal=ph.length?'<div class="gal">'+ph.map(r=>'<img src="'+r.p+'" alt="同学上传的菜品照片">').join("")+'</div>':'';
$("#dlgBody").innerHTML=(IMG[d.id]?'<img class="himg" src="'+IMG[d.id]+'" alt="'+d.n+'">':'')+'<div class="row" style="justify-content:space-between"><h2>'+d.n+'</h2><button class="btn ghost" id="x" aria-label="关闭">关闭</button></div>'+
'<div class="meta">'+d.c+' · '+d.w+' · ¥'+d.p+' · 现在约排 '+d.q+' 分钟（高峰约 '+d.pk+'）</div><div>'+badge(d)+'</div><p style="margin:0">'+d.d+'</p>'+
'<div><b style="font-size:26px">'+d.r.toFixed(1)+'</b> <span class="meta">/5 · '+d.k+'人评 · 踩雷率 '+fmtLei(d.rate)+'</span><div class="bar" title="绿色为不踩雷占比"><i style="width:'+Math.round((1-d.rate)*100)+'%"></i></div></div>'+
gal+'<div><b>最新点评</b>'+revs.map(r=>{const c=sc(r.k);return '<div class="rev rv"><span style="color:var(--yelink);background:var(--yel);border-radius:6px;padding:0 6px;font-size:13px">'+r.s+'星</span> <span class="meta">'+r.w+'</span><div>'+esc(r.t)+'</div>'+(r.p?'<img src="'+r.p+'" alt="点评照片">':'')+'<div class="act"><button data-lk="'+r.k+'">有用 '+(c.lk||"")+'</button><button data-rp="'+r.k+'">评论 '+(c.rp.length||"")+'</button></div>'+c.rp.map(x=>'<div class="rp">'+esc(x)+'</div>').join("")+(rk==r.k?'<div class="row" style="margin-top:6px"><input id="rin" maxlength="60" placeholder="写评论" style="font:inherit;flex:1;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:4px 8px"><button class="btn" data-send="1">发送</button></div>':'')+'</div>'}).join("")+'</div>'+
'<div class="rev"><b>我也评一下</b><div class="stars" id="stars">'+[1,2,3,4,5].map(i=>'<button data-s="'+i+'" class="'+(i<=stars?"on":"")+'" aria-label="'+i+'星">★</button>').join("")+'</div>'+
'<textarea id="txt" maxlength="80" placeholder="一句话说说：味道、份量、排队、值不值（最多80字）"></textarea><div class="row" style="margin-top:8px"><label class="btn ghost">📷 添加照片<input type="file" id="pf" accept="image/*" hidden></label><span class="meta" id="pn">'+(pend?"已添加照片":"")+'</span><button class="btn" id="sub">提交点评</button><span class="meta" id="msg"></span></div></div>'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#dlg").onclick=e=>{const t=e.target.closest("button")||e.target,a=t.dataset;
if(t.id=="x"||t===$("#dlg"))$("#dlg").close();
else if(t.dataset.s){const v=$("#txt")?$("#txt").value:"";stars=+t.dataset.s;paint();$("#txt").value=v}
else if(a.lk){sc(a.lk).lk++;sv("fk_soc",S);paint()}
else if(a.rp){rk=a.rp;paint()}
else if(a.send){const v=$("#rin").value.trim();if(v){sc(rk).rp.push(v);sv("fk_soc",S)}rk=null;paint()}
else if(t.id=="sub"){const v=$("#txt").value.trim();if(!stars){$("#msg").textContent="请先选择星级";return}
U.push({id:cur,s:stars,t:v||"（未写文字）",p:pend});if(!sv("fk_rev",U)){U[U.length-1].p=null;sv("fk_rev",U)}pend=null;stars=0;
paint();$("#msg").textContent="已提交，评分已更新";render()}};
$("#dlg").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pend=c.toDataURL("image/jpeg",.6);$("#pn").textContent="已添加照片"};im.src=fr.result};fr.readAsDataURL(f)};
const lv=m=>m<=4?[1,"畅通"]:m<=9?[2,"一般"]:[3,"拥挤"];
function renderQ(){$("#note").textContent="根据当前时段和同学反馈估算，反馈 30 分钟内有效。刚路过窗口的话，点一下帮大家省时间。";const t=nowT();
const L=Object.keys(B).filter(k=>st.can=="全部"||k.startsWith(st.can)).map(k=>({k,...est(k)})).sort((a,b)=>a.m-b.m);
$("#list").innerHTML=L.map(x=>{const[c,tx]=lv(x.m);return '<div class="q"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><b>'+x.k.replace("·"," · ")+'</b><div class="meta">'+D.filter(d=>d.c+"·"+d.w==x.k).map(d=>d.n).join("、")+'</div></div><div class="qn">'+x.m+'<span class="meta" style="font-weight:400;font-size:13px"> 分钟</span></div></div>'+
'<div><span class="qs q'+c+'">'+tx+'</span> <span class="meta">'+(x.ago==null?"按当前时段估算":x.ago+" 分钟前同学反馈")+'</span></div>'+
'<div class="spark" role="img" aria-label="全天排队趋势">'+Array.from({length:16},(_,i)=>'<i class="'+(Math.floor(t)==6+i?"now":"")+'" style="height:'+Math.round(fq(6+i+.5)*100)+'%"></i>').join("")+'</div><div class="meta">6 点到 21 点的排队趋势，黄色是现在</div>'+
'<div class="row"><span class="meta">刚路过？报告排队</span>'+[[0,"不用排"],[5,"约5分钟"],[10,"约10分钟"],[15,"15分钟以上"]].map(r=>'<button class="chip" data-k="'+x.k+'" data-rq="'+r[0]+'">'+r[1]+'</button>').join("")+'</div></div>'}).join("")||'<div class="empty">该食堂暂无窗口数据</div>'}
["h1","h2","h3"].forEach((k,i)=>$("#"+k).src=IMG[[17,14,13][i]]);chipAll();render();
</script>
</body>
</html>
